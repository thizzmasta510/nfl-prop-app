name: NBA injury report

# Hourly from 8 AM to midnight ET (13:05-04:05 UTC), when teams post and update
# the official report before games. Also runnable by hand.
on:
  schedule:
    - cron: "5 13-23 * * *"
    - cron: "5 0-4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nba-injuries
  cancel-in-progress: false

jobs:
  injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pdfplumber pandas

      # Official NBA report PDF first, ESPN feed as a fallback. Exits non-zero
      # (and writes nothing) if both fail, so a failed run keeps the last good file.
      # Parser fixtures (including the garbled Nov 1 text): a broken parser fails here
      # and the last good file is kept.
      - name: Test the report parser
        run: cd github-action && python test_nba_injuries.py

      - name: Fetch latest injury report
        run: |
          cd github-action && python compute_nba_injuries.py
          mv nba-injuries.json ../
          if [ -f nba-injury-history.json ]; then mv nba-injury-history.json ../; fi
        timeout-minutes: 10

      # Straight into the app's storage (needed once the repo is private; skipped without the secrets).
      - name: Upload to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        continue-on-error: true
        run: bash github-action/upload_r2.sh nba-injuries.json nba-injuries.json --stamp

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nba-injuries.json
          [ -f nba-injury-history.json ] && git add nba-injury-history.json
          if git diff --quiet --cached; then
            echo "Nothing to commit."
          else
            git commit -m "Update NBA injury report"
            git pull --rebase
            git push
          fi
