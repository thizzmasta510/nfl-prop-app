name: Compute NBA trend logs

# Daily at 14:10 UTC (about 10 AM ET), after the previous night's games are final.
on:
  schedule:
    - cron: "10 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  nba-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nba_api pandas

      # Exits non-zero (and writes nothing) if stats.nba.com can't be reached,
      # so a failed run never replaces good data with an empty file.
      - name: Compute NBA game logs
        run: cd github-action && python compute_nba_logs.py && mv nba-trend-logs.json ../

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nba-trend-logs.json
          if git diff --quiet --cached; then
            echo "Nothing to commit."
          else
            git commit -m "Update NBA trend logs"
            git push
          fi
