name: Compute weekly NFL stats

on:
  schedule:
    # Tuesday 09:00 UTC and Friday 17:00 UTC, an hour ahead of the Worker's own
    # cron so the published files are ready before the Worker fetches them.
    - cron: "0 9 * * 2"
    - cron: "0 17 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 3.11 deliberately, not 3.12+. nfl_data_py pins numpy<2.0, which on
          # 3.12 makes pip backtrack pandas to 1.5.3 — a version with no 3.12
          # wheel, so it tries to build from source and fails on a missing
          # pkg_resources. 3.11 has wheels for the whole pinned set.
          python-version: "3.11"

      # pyarrow is an implicit requirement: nfl_data_py reads parquet files and
      # will fail at import or first read without it. Installing it explicitly
      # rather than relying on dependency resolution.
      # Versions are pinned rather than resolved. Left to itself, pip tries to
      # satisfy nfl_data_py's numpy<2.0 pin by walking pandas backwards until it
      # reaches a version that predates prebuilt wheels, then fails compiling
      # from source. Installing the constrained set first, then nfl_data_py on
      # top, avoids the backtracking entirely.
      #
      # setuptools is explicit because some older build paths still expect
      # pkg_resources, which is no longer bundled by default.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install "numpy<2" "pandas>=2.0,<3" pyarrow
          pip install nfl_data_py
          echo "--- installed versions ---"
          python - <<'PY'
          import pandas, numpy, pyarrow
          print("pandas ", pandas.__version__)
          print("numpy  ", numpy.__version__)
          print("pyarrow", pyarrow.__version__)
          try:
              import nfl_data_py
              print("nfl_data_py imported OK")
          except Exception as e:
              print("nfl_data_py import FAILED:", type(e).__name__, e)
              raise
          PY

      # Prints the actual column names the dataset exposes before any script
      # runs. The scripts were written against documented column names that
      # have never been checked against live data, so if they have drifted this
      # is where it shows up, with the real names visible rather than guessed.
      - name: Inspect available columns
        run: |
          python - <<'PY'
          import nfl_data_py as nfl
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          season = now.year if now.month >= 3 else now.year - 1
          print("season:", season)
          try:
              wk = nfl.import_weekly_data([season], downcast=True)
              print("weekly rows:", len(wk))
              print("weekly columns:", sorted(wk.columns.tolist()))
          except Exception as e:
              print("import_weekly_data FAILED:", type(e).__name__, e)
          try:
              pbp = nfl.import_pbp_data([season], downcast=True)
              print("pbp rows:", len(pbp))
              cols = pbp.columns.tolist()
              wanted = ["qb_dropback","qb_hit","sack","yardline_100","play_type",
                        "posteam","week","rusher_player_name","receiver_player_name"]
              print("pbp has wanted cols:", {c: (c in cols) for c in wanted})
          except Exception as e:
              print("import_pbp_data FAILED:", type(e).__name__, e)
          PY

      - name: Compute player stat lines
        run: python github-action/compute_player_stats.py

      - name: Compute weekly team/usage stats
        run: python github-action/compute_weekly_stats.py
        continue-on-error: true

      - name: Show what was produced
        if: always()
        run: |
          for f in player-stats.json weekly-stats.json; do
            if [ -f "$f" ]; then
              echo "$f: $(wc -c < $f) bytes"
              head -c 300 "$f"; echo
            else
              echo "$f: NOT CREATED"
            fi
          done

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in player-stats.json weekly-stats.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --quiet --cached; then
            echo "Nothing to commit."
          else
            git commit -m "Update NFL stat feeds"
            git push
          fi
